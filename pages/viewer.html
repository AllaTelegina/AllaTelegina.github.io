<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Presentation Viewer | Alla Telegina</title><link rel="stylesheet" href="../style.css"><script src="../viewer.js" defer></script></head>
<body class="presentation-viewer"><main id="presentationViewer" class="viewer-shell">
<header class="viewer-toolbar"><a id="viewerBack" class="viewer-back" href="projects.html?category=presentations">&#8592; Back to project</a><h1 id="viewerTitle">Presentation</h1><button id="viewerFullscreen" type="button" class="btn btn-secondary">Full screen</button></header>
<figure class="viewer-figure"><img id="viewerImage" alt="" draggable="false"><figcaption class="viewer-credit">Alla Telegina</figcaption></figure>
<nav class="viewer-controls" aria-label="Presentation pages"><button id="viewerPrevious" type="button" class="btn btn-secondary" aria-label="Previous page">&#8592; Previous</button><label for="viewerPage">Page <select id="viewerPage" aria-label="Select page"></select></label><p id="viewerStatus" role="status" aria-live="polite"></p><button id="viewerNext" type="button" class="btn">Next &#8594;</button></nav>
<p class="viewer-help">Use the arrows, swipe, or choose a page to browse.</p><p id="viewerError" role="alert" hidden>The page could not be loaded. Please refresh and try again.</p>
</main></body></html>
